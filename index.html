<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>花蓮公車客運班次查詢與動態模擬系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        #leaflet-map-box { height: 580px; width: 100%; border-radius: 1.5rem; z-index: 10; }

        .station-label-icon { background: transparent; border: none; }
        .station-badge {
            background: rgba(15, 23, 42, 0.88);
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 6px;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            transform: translateY(-20px);
            display: inline-block;
            transition: all 0.2s ease;
        }
        .station-badge-docking {
            background: #f59e0b;
            color: #0f172a;
            font-weight: 900;
            border: 2px solid #ffffff;
            transform: translateY(-24px) scale(1.08);
        }

        .bus-marker-icon { background: transparent; border: none; }
        .bus-badge-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
        }
        .bus-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            color: white;
            font-size: 15px;
            border: 3px solid #ffffff;
            box-shadow: 0 4px 14px rgba(0,0,0,0.5);
            z-index: 2;
            transition: transform 0.2s ease;
        }
        .bus-docking-ring {
            position: absolute;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 3px solid #f59e0b;
            background: rgba(245, 158, 11, 0.25);
            animation: pulse-ring 1.2s cubic-bezier(0.24, 0, 0.38, 1) infinite;
            z-index: 1;
        }
        .bus-docking-tag {
            position: absolute;
            top: -22px;
            background: #f59e0b;
            color: #0f172a;
            font-size: 10px;
            font-weight: 900;
            padding: 1px 6px;
            border-radius: 999px;
            white-space: nowrap;
            border: 1.5px solid #ffffff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.35);
            z-index: 3;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.85); opacity: 0.9; }
            70% { transform: scale(1.35); opacity: 0; }
            100% { transform: scale(1.35); opacity: 0; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

    <!-- 頁首導覽 -->
    <header class="bg-slate-900 text-white shadow-xl sticky top-0 z-50 border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="goHome()">
                <div class="bg-emerald-500 p-2.5 rounded-2xl text-white shadow-lg shadow-emerald-500/30">
                    <i class="fa-solid fa-bus text-xl"></i>
                </div>
                <div>
                    <h1 class="font-black text-lg tracking-wide text-white">花蓮公車客運班次與動態模擬系統</h1>
                    <p class="text-[11px] text-emerald-400 font-semibold tracking-wider">依客運業者專屬色彩呈現，支援沿線停靠站模擬與即時進度追蹤</p>
                </div>
            </div>
            <button id="btn-back-home" onclick="goHome()" class="hidden bg-slate-800 hover:bg-slate-700 text-white border border-slate-700 px-4 py-2 rounded-xl text-xs font-bold flex items-center transition">
                <i class="fa-solid fa-arrow-left mr-2 text-emerald-400"></i>返回首頁選擇其他班次
            </button>
        </div>
    </header>

    <!-- ==========================================
         視圖 1：首頁（客運業者分類與所有班次總覽）
         ========================================== -->
    <section id="home-view" class="max-w-7xl mx-auto px-6 py-8 space-y-6">
        
        <!-- 歡迎橫幅與客運篩選 -->
        <div class="bg-white rounded-3xl p-6 border border-slate-200/80 shadow-md space-y-5">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-100 pb-4">
                <div>
                    <h2 class="text-xl font-black text-slate-800">請選擇客運業者與欲模擬的發車班次</h2>
                    <p class="text-xs text-slate-500 font-bold mt-1">點擊下方任一發車時間，系統將以該客運專屬色彩呈現路線並立即啟動行駛與靠站模擬</p>
                </div>
                <div class="relative w-full md:w-64">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-xs"></i>
                    <input type="text" id="route-search-input" oninput="renderHomeOperators()" placeholder="搜尋路線編號或站名..." class="w-full pl-9 pr-4 py-2 bg-slate-100 border border-slate-200 rounded-xl text-xs font-bold focus:outline-none focus:border-slate-400">
                </div>
            </div>

            <!-- 客運公司篩選按鈕 -->
            <div id="operator-filter-tabs" class="flex flex-wrap gap-2"></div>
        </div>

        <!-- 載入提示 -->
        <div id="home-loading" class="text-center py-16 text-slate-400 font-bold text-sm">
            <i class="fa-solid fa-spinner fa-spin text-2xl text-emerald-500 mb-3 block"></i>
            正在載入花蓮各家客運路網與班次資料...
        </div>

        <!-- 客運公司與路線班次卡片列表 -->
        <div id="operators-container" class="space-y-8"></div>

    </section>

    <!-- ==========================================
         視圖 2：單一班次專屬動態模擬器
         ========================================== -->
    <section id="sim-view" class="hidden max-w-7xl mx-auto px-6 py-6 space-y-6">

        <!-- 精簡路線標題列 -->
        <div class="bg-white rounded-3xl p-5 border border-slate-200/80 shadow-md flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <span id="sim-operator-badge" class="text-white text-xs font-black px-3 py-1 rounded-lg shadow-sm">太魯閣客運</span>
                <span id="sim-route-badge" class="bg-slate-800 text-white text-xs font-black px-3 py-1 rounded-lg">301 路</span>
                <h2 id="sim-route-title" class="text-lg font-black text-slate-800">花蓮轉運站 ⇄ 東華大學</h2>
            </div>
            <div class="flex items-center space-x-3 text-xs font-bold">
                <span class="bg-slate-100 text-slate-600 px-3 py-1.5 rounded-xl">
                    發車時間：<strong id="sim-trip-start-label" class="text-slate-900 font-mono text-sm ml-1">08:00</strong>
                </span>
                <span id="sim-live-status" class="border px-3.5 py-1.5 rounded-xl flex items-center transition-colors">
                    <span id="sim-status-dot" class="w-2 h-2 rounded-full mr-2"></span>
                    <span id="sim-status-text">公車模擬行駛中...</span>
                </span>
            </div>
        </div>

        <!-- 主體內容：左側沿線停靠站時刻表 + 右側地圖 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- 左側：本班次各站預估時刻表 -->
            <div class="bg-white rounded-3xl p-6 border border-slate-200/80 shadow-md space-y-4 flex flex-col h-[580px]">
                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                    <h3 class="font-extrabold text-sm text-slate-800 flex items-center">
                        <i id="timeline-clock-icon" class="fa-solid fa-list-ol mr-2"></i>本班次沿線停靠站與預估時間
                    </h3>
                </div>
                <div id="stop-timeline-list" class="space-y-1.5 overflow-y-auto pr-1 flex-1 no-scrollbar"></div>
            </div>

            <!-- 右側：地圖路徑與動態公車展示 -->
            <div class="lg:col-span-2 bg-white rounded-3xl p-6 border border-slate-200/80 shadow-md space-y-3">
                <div class="flex justify-between items-center">
                    <h3 class="font-extrabold text-sm text-slate-800 flex items-center">
                        <i id="map-title-icon" class="fa-solid fa-map-location-dot mr-2 text-base"></i>班次行駛道路與即時靠站動態
                    </h3>
                    <label class="text-xs font-bold text-slate-600 flex items-center cursor-pointer select-none">
                        <input type="checkbox" id="toggle-labels" checked onchange="toggleStationLabels()" class="mr-1.5 rounded text-blue-600">
                        顯示站名標籤
                    </label>
                </div>
                <div id="leaflet-map-box" class="shadow-inner border border-slate-200"></div>
            </div>

        </div>

    </section>

    <script>
        let rawNetworkData = null;
        let allRoutesData = [];
        let globalStopsMap = {};
        let pathMetricsCache = {};
        let selectedOperatorFilter = "ALL";

        // 客運公司專屬代表色與樣式定義
        const OPERATOR_THEMES = {
            "太魯閣客運": {
                primary: "#10b981",      // 翡翠綠
                dark: "#047857",
                lightBg: "#ecfdf5",
                border: "#a7f3d0",
                text: "#065f46"
            },
            "統聯客運": {
                primary: "#f97316",      // 活力橘
                dark: "#c2410c",
                lightBg: "#fff7ed",
                border: "#fed7aa",
                text: "#9a3412"
            },
            "興東客運 / 花蓮客運": {
                primary: "#2563eb",      // 經典藍
                dark: "#1d4ed8",
                lightBg: "#eff6ff",
                border: "#bfdbfe",
                text: "#1e40af"
            },
            "花蓮市區與公路客運": {
                primary: "#8b5cf6",      // 優雅紫
                dark: "#6d28d9",
                lightBg: "#f5f3ff",
                border: "#ddd6fe",
                text: "#5b21b6"
            }
        };

        function getOperatorTheme(opName) {
            return OPERATOR_THEMES[opName] || OPERATOR_THEMES["花蓮市區與公路客運"];
        }

        let activeSim = {
            route: null,
            routeKey: null,
            directionKey: null,
            trip: null,
            operatorName: "",
            theme: null,
            startSec: 28800,
            endSec: 31500,
            scheduleSegments: [] // 儲存每一站的 { arrTime, depTime, distM, name } 確保精準停靠
        };

        let leafletMap = null;
        let staticLayers = [];
        let labelMarkers = [];
        let busMarkersLayer = null;
        let lastHighlightedStopIdx = -1;

        let simTimeSec = 28800;
        let isPlaying = false;
        const SIM_SPEED = 25; // 模擬倍速（讓靠站停頓與路段移動節奏更清晰）
        let lastFrameTimestamp = null;

        function getOperatorName(route) {
            if (route.operator) {
                if (route.operator.includes("太魯閣")) return "太魯閣客運";
                if (route.operator.includes("統聯")) return "統聯客運";
                if (route.operator.includes("興東") || route.operator.includes("花蓮客運")) return "興東客運 / 花蓮客運";
                return route.operator;
            }
            const code = getRouteKey(route).replace('hualien_', '');
            if (code.startsWith('301') || code.startsWith('302') || code.startsWith('303') || code.startsWith('305')) {
                return "太魯閣客運";
            }
            if (code.startsWith('308') || code.startsWith('310') || code.startsWith('311') || code.startsWith('1121') || code.startsWith('1122') || code.startsWith('1128') || code.startsWith('1129') || code.startsWith('1132') || code.startsWith('1133') || code.startsWith('1136') || code.startsWith('1139') || code.startsWith('1140') || code.startsWith('1141')) {
                return "統聯客運";
            }
            if (code.startsWith('1125') || code.startsWith('1130') || code.startsWith('1145')) {
                return "興東客運 / 花蓮客運";
            }
            return "花蓮市區與公路客運";
        }

        function toLatLng(coord) {
            if (!Array.isArray(coord) || coord.length < 2) return null;
            const a = Number(coord[0]);
            const b = Number(coord[1]);
            if (isNaN(a) || isNaN(b)) return null;
            if (Math.abs(a) > 90) return [b, a];
            return [a, b];
        }

        function extractStopCoord(stObj) {
            if (!stObj) return null;
            if (Array.isArray(stObj.coord)) return toLatLng(stObj.coord);
            if (Array.isArray(stObj.location)) return toLatLng(stObj.location);
            if (Array.isArray(stObj.pos)) return toLatLng(stObj.pos);
            if (typeof stObj.lat === 'number' && typeof stObj.lng === 'number') return [stObj.lat, stObj.lng];
            if (typeof stObj.lat === 'number' && typeof stObj.lon === 'number') return [stObj.lat, stObj.lon];
            return null;
        }

        function getRouteKey(r, fallbackIdx = 0) {
            return String(r.code || r.id || r.routeId || r.routeNumber || r.name || `route_${fallbackIdx}`);
        }

        function initMap() {
            if (leafletMap) return;
            leafletMap = L.map('leaflet-map-box').setView([23.987, 121.601], 13);
            L.tileLayer('https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}', {
                maxZoom: 19,
                attribution: '&copy; 內政部國土測繪中心'
            }).addTo(leafletMap);
            busMarkersLayer = L.layerGroup().addTo(leafletMap);
        }

        function buildGlobalStopIndex(data) {
            globalStopsMap = {};
            const addStop = (s, keyFallback) => {
                if (!s || typeof s !== 'object') return;
                const id = s.id || s.stopId || keyFallback;
                if (id) globalStopsMap[id] = { ...s, id };
            };
            if (Array.isArray(data.stops)) {
                data.stops.forEach((s, i) => addStop(s, `stop_${i}`));
            } else if (data.stops && typeof data.stops === 'object') {
                Object.entries(data.stops).forEach(([k, v]) => addStop(v, k));
            }
        }

        async function loadNetworkData() {
            try {
                const res = await fetch('./bus_network.json');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                rawNetworkData = data;

                buildGlobalStopIndex(data);
                allRoutesData = (data.routes || []).filter(r => r && r.patterns);
                document.getElementById('home-loading').classList.add('hidden');

                renderOperatorFilterTabs();
                renderHomeOperators();
            } catch (err) {
                document.getElementById('home-loading').innerHTML = `
                    <div class="text-rose-500 font-black">無法讀取 bus_network.json</div>
                    <div class="text-xs text-slate-500 mt-1">請確認 bus_network.json 與 index.html 位於同一資料夾中。</div>
                `;
            }
        }

        function getStopsForDirection(route, directionKey) {
            const pattern = route.patterns ? route.patterns[directionKey] : null;
            if (!pattern) return [];
            const patternId = pattern.id || directionKey;

            const localLookup = { ...globalStopsMap };
            if (Array.isArray(route.stops)) {
                route.stops.forEach(s => { if (s && (s.id || s.stopId)) localLookup[s.id || s.stopId] = s; });
            } else if (route.stops && typeof route.stops === 'object') {
                Object.entries(route.stops).forEach(([k, v]) => {
                    if (Array.isArray(v)) v.forEach(s => { if (s && (s.id || s.stopId)) localLookup[s.id || s.stopId] = s; });
                    else if (v && typeof v === 'object') localLookup[v.id || k] = v;
                });
            }

            const callList = pattern.stopCalls || pattern.stops || pattern.stopIds || null;
            if (Array.isArray(callList) && callList.length > 0) {
                const resolved = callList.map((item, idx) => {
                    if (typeof item === 'string') {
                        const st = localLookup[item] || {};
                        return { id: item, name: st.name || st.stopName || `第 ${idx + 1} 站`, coord: extractStopCoord(st), distanceAlongPathM: null };
                    } else if (item && typeof item === 'object') {
                        const sid = item.stopId || item.id;
                        const st = (sid && localLookup[sid]) ? localLookup[sid] : {};
                        return {
                            id: sid || `s_${idx}`,
                            name: item.name || item.stopName || st.name || st.stopName || `第 ${idx + 1} 站`,
                            coord: extractStopCoord(item) || extractStopCoord(st),
                            distanceAlongPathM: typeof item.distanceAlongPathM === 'number' ? item.distanceAlongPathM : null
                        };
                    }
                    return null;
                }).filter(s => s && s.coord);
                if (resolved.length > 0) return resolved;
            }

            if (route.stops && !Array.isArray(route.stops)) {
                const list = route.stops[directionKey] || route.stops[patternId];
                if (Array.isArray(list)) {
                    return list.map((s, idx) => ({
                        id: s.id || `s_${idx}`,
                        name: s.name || `第 ${idx + 1} 站`,
                        coord: extractStopCoord(s),
                        distanceAlongPathM: s.distanceAlongPathM ?? null
                    })).filter(s => s.coord);
                }
            }
            return [];
        }

        function getTripsForDirection(route, directionKey) {
            const pattern = route.patterns ? route.patterns[directionKey] : null;
            const patternId = pattern ? (pattern.id || directionKey) : directionKey;
            const routeId = route.id || route.code;

            if (pattern && Array.isArray(pattern.trips)) return pattern.trips;
            if (route.trips) {
                if (!Array.isArray(route.trips)) return route.trips[directionKey] || route.trips[patternId] || [];
                const matched = route.trips.filter(t => t.patternId === patternId || t.patternId === directionKey || t.direction === directionKey);
                if (matched.length > 0) return matched;
                if (Object.keys(route.patterns).length === 1) return route.trips;
            }
            if (rawNetworkData && Array.isArray(rawNetworkData.trips)) {
                return rawNetworkData.trips.filter(t => t.patternId === patternId || (t.routeId === routeId && (t.direction === directionKey || t.patternId === directionKey)));
            }
            return [];
        }

        function getTimingProfileForDirection(route, directionKey, sampleTrip) {
            const pattern = route.patterns ? route.patterns[directionKey] : null;
            const patternId = pattern ? (pattern.id || directionKey) : directionKey;
            const profileId = sampleTrip ? sampleTrip.timingProfileId : null;

            const sources = [route.timingProfiles, rawNetworkData?.timingProfiles].filter(Boolean);
            for (const src of sources) {
                if (!Array.isArray(src)) {
                    const found = (profileId && src[profileId]) || src[directionKey] || src[patternId];
                    if (found) return Array.isArray(found) ? found : (found.stops || found.calls || null);
                } else {
                    const found = src.find(p => p.id === profileId || p.patternId === patternId || p.direction === directionKey);
                    if (found) return Array.isArray(found) ? found : (found.stops || found.calls || null);
                }
            }
            return null;
        }

        // ==========================================
        // 首頁視圖渲染（客運公司專屬色彩 + 班次卡片）
        // ==========================================
        function renderOperatorFilterTabs() {
            const operators = ["ALL", ...new Set(allRoutesData.map(r => getOperatorName(r)))];
            const container = document.getElementById('operator-filter-tabs');
            container.innerHTML = '';

            operators.forEach(op => {
                const btn = document.createElement('button');
                const isActive = op === selectedOperatorFilter;
                const theme = op === "ALL" ? { primary: "#0f172a" } : getOperatorTheme(op);

                if (isActive) {
                    btn.className = "px-4 py-2 rounded-xl text-white text-xs font-black shadow-sm transition flex items-center space-x-2";
                    btn.style.backgroundColor = theme.primary;
                } else {
                    btn.className = "px-4 py-2 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 text-xs font-bold transition flex items-center space-x-2";
                }

                const dotHtml = op === "ALL" ? "" : `<span class="w-2.5 h-2.5 rounded-full inline-block border border-white/60" style="background:${theme.primary}"></span>`;
                btn.innerHTML = `${dotHtml}<span>${op === "ALL" ? "全部客運業者" : op}</span>`;
                btn.onclick = () => {
                    selectedOperatorFilter = op;
                    renderOperatorFilterTabs();
                    renderHomeOperators();
                };
                container.appendChild(btn);
            });
        }

        function renderHomeOperators() {
            const container = document.getElementById('operators-container');
            const keyword = (document.getElementById('route-search-input').value || '').trim().toLowerCase();
            container.innerHTML = '';

            const grouped = {};
            allRoutesData.forEach((route, idx) => {
                const op = getOperatorName(route);
                if (selectedOperatorFilter !== "ALL" && op !== selectedOperatorFilter) return;

                const rKey = getRouteKey(route, idx).replace('hualien_', '');
                const rName = route.name || rKey;
                if (keyword && !rKey.toLowerCase().includes(keyword) && !rName.toLowerCase().includes(keyword)) return;

                if (!grouped[op]) grouped[op] = [];
                grouped[op].push({ route, rKey });
            });

            const operatorNames = Object.keys(grouped);
            if (operatorNames.length === 0) {
                container.innerHTML = `<div class="bg-white rounded-3xl p-12 text-center text-slate-400 font-bold text-sm">找不到符合條件的客運路線</div>`;
                return;
            }

            operatorNames.forEach(opName => {
                const theme = getOperatorTheme(opName);
                const section = document.createElement('div');
                section.className = "space-y-4";

                section.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="w-2.5 h-6 rounded-full" style="background:${theme.primary}"></span>
                        <h3 class="text-lg font-black text-slate-800">${opName}</h3>
                        <span class="text-xs font-bold px-2.5 py-0.5 rounded-full border" style="background:${theme.lightBg}; color:${theme.text}; border-color:${theme.border};">
                            共 ${grouped[opName].length} 條路線
                        </span>
                    </div>
                `;

                const grid = document.createElement('div');
                grid.className = "grid grid-cols-1 md:grid-cols-2 gap-5";

                grouped[opName].forEach(({ route, rKey }) => {
                    const card = document.createElement('div');
                    card.className = "bg-white rounded-3xl p-6 border border-slate-200/80 shadow-md hover:shadow-lg transition space-y-4 flex flex-col justify-between";
                    card.style.borderTop = `4px solid ${theme.primary}`;

                    const dirs = Object.keys(route.patterns);
                    let dirsHtml = '';

                    dirs.forEach(dir => {
                        const headsign = route.patterns[dir]?.headsign || (dir === 'outbound' ? '去程' : '返程');
                        const trips = [...getTripsForDirection(route, dir)].sort((a, b) => Number(a.startSec ?? 0) - Number(b.startSec ?? 0));

                        let tripBtns = '';
                        if (trips.length === 0) {
                            tripBtns = `<span class="text-xs text-slate-400">無固定班次資料</span>`;
                        } else {
                            trips.forEach((t, tIdx) => {
                                const startSec = Number(t.startSec ?? t.departureSec ?? 0);
                                const timeLabel = secToTimeStr(startSec);
                                tripBtns += `
                                    <button onclick="startTripSimulation('${getRouteKey(route)}', '${dir}', ${tIdx})"
                                        onmouseover="this.style.backgroundColor='${theme.primary}'; this.style.color='#ffffff'; this.style.borderColor='${theme.primary}';"
                                        onmouseout="this.style.backgroundColor='#f8fafc'; this.style.color='#334155'; this.style.borderColor='#e2e8f0';"
                                        class="px-3 py-1.5 rounded-xl bg-slate-50 border border-slate-200 font-mono text-xs font-black text-slate-700 transition shadow-sm flex items-center space-x-1">
                                        <span>${timeLabel}</span>
                                    </button>
                                `;
                            });
                        }

                        dirsHtml += `
                            <div class="space-y-2 pt-2 border-t border-slate-100">
                                <div class="text-xs font-extrabold text-slate-500 flex items-center justify-between">
                                    <span><i class="fa-solid fa-arrow-right mr-1.5" style="color:${theme.primary}"></i>往 ${headsign}</span>
                                    <span class="text-[11px] text-slate-400">${trips.length} 班次</span>
                                </div>
                                <div class="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto no-scrollbar">
                                    ${tripBtns}
                                </div>
                            </div>
                        `;
                    });

                    card.innerHTML = `
                        <div class="space-y-3">
                            <div class="flex items-start justify-between gap-2">
                                <div>
                                    <span class="inline-block text-white text-xs font-black px-2.5 py-1 rounded-lg mb-1.5 shadow-sm" style="background:${theme.primary}">${rKey} 路</span>
                                    <h4 class="font-black text-base text-slate-800 leading-snug">${route.name || rKey}</h4>
                                </div>
                            </div>
                            ${dirsHtml}
                        </div>
                    `;
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                container.appendChild(section);
            });
        }

        // ==========================================
        // 建立該班次含「明確靠站停等時間」的完整時刻段表
        // ==========================================
        function buildTripScheduleSegments(route, routeKey, directionKey, trip, startSec) {
            const pattern = route.patterns[directionKey];
            const stops = getStopsForDirection(route, directionKey);
            const metrics = getPathMetrics(routeKey, directionKey, pattern.path);
            const profile = getTimingProfileForDirection(route, directionKey, trip);

            const DWELL_SECONDS = 15; // 每一站至少停靠 15 秒讓使用者清楚看到靠站動作
            const segments = [];

            if (Array.isArray(profile) && profile.length > 0 && stops.length > 0) {
                const count = Math.min(profile.length, stops.length);
                for (let i = 0; i < count; i++) {
                    const p = profile[i];
                    const rawArr = startSec + (p.arrivalOffsetSec ?? 0);
                    let rawDep = startSec + (p.departureOffsetSec ?? rawArr);
                    // 確保每站都有足夠視覺辨識的停靠時間（首站與中間站皆保留停靠感）
                    if (rawDep - rawArr < DWELL_SECONDS) {
                        rawDep = rawArr + DWELL_SECONDS;
                    }
                    const distM = (typeof stops[i].distanceAlongPathM === 'number')
                        ? stops[i].distanceAlongPathM
                        : (metrics.totalDist * (i / Math.max(1, count - 1)));

                    segments.push({
                        stopIdx: i,
                        name: stops[i].name,
                        arrTime: rawArr,
                        depTime: rawDep,
                        distM
                    });
                }
            } else if (stops.length > 0) {
                // 若無 timingProfiles，依道路距離均分並自動加入每站 15 秒靠站停等
                const totalTravelSec = Math.max(900, Math.round(metrics.totalDist / 8.5));
                const stepTravel = totalTravelSec / Math.max(1, stops.length - 1);
                let cursor = startSec;

                for (let i = 0; i < stops.length; i++) {
                    const arrTime = Math.round(cursor);
                    const depTime = arrTime + DWELL_SECONDS;
                    const distM = (typeof stops[i].distanceAlongPathM === 'number')
                        ? stops[i].distanceAlongPathM
                        : (metrics.totalDist * (i / Math.max(1, stops.length - 1)));

                    segments.push({
                        stopIdx: i,
                        name: stops[i].name,
                        arrTime,
                        depTime,
                        distM
                    });
                    cursor = depTime + Math.max(20, stepTravel);
                }
            }

            return segments;
        }

        // ==========================================
        // 進入視圖 2：單一班次專屬模擬器（套用業者顏色 + 靠站模擬）
        // ==========================================
        function startTripSimulation(fullRouteKey, directionKey, sortedTripIndex) {
            const route = allRoutesData.find((r, idx) => getRouteKey(r, idx) === fullRouteKey);
            if (!route) return;

            const trips = [...getTripsForDirection(route, directionKey)].sort((a, b) => Number(a.startSec ?? 0) - Number(b.startSec ?? 0));
            const trip = trips[sortedTripIndex];
            if (!trip) return;

            const operatorName = getOperatorName(route);
            const theme = getOperatorTheme(operatorName);
            const startSec = Number(trip.startSec ?? trip.departureSec ?? 0);
            const segments = buildTripScheduleSegments(route, fullRouteKey, directionKey, trip, startSec);
            const endSec = segments.length > 0 ? segments[segments.length - 1].depTime : (startSec + 2400);

            activeSim = {
                route,
                routeKey: fullRouteKey,
                directionKey,
                trip,
                operatorName,
                theme,
                startSec,
                endSec,
                scheduleSegments: segments
            };
            lastHighlightedStopIdx = -1;

            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('sim-view').classList.remove('hidden');
            document.getElementById('btn-back-home').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });

            initMap();
            setTimeout(() => leafletMap.invalidateSize(), 100);

            // 套用客運公司專屬顏色到模擬器 UI
            const headsign = route.patterns[directionKey]?.headsign || (directionKey === 'outbound' ? '去程' : '返程');
            const opBadge = document.getElementById('sim-operator-badge');
            opBadge.innerText = operatorName;
            opBadge.style.backgroundColor = theme.primary;

            const rtBadge = document.getElementById('sim-route-badge');
            rtBadge.innerText = `${fullRouteKey.replace('hualien_', '')} 路`;
            rtBadge.style.backgroundColor = theme.dark;

            document.getElementById('sim-route-title').innerText = `${route.name}（往 ${headsign}）`;
            document.getElementById('sim-trip-start-label').innerText = secToTimeStr(startSec);
            document.getElementById('timeline-clock-icon').style.color = theme.primary;
            document.getElementById('map-title-icon').style.color = theme.primary;

            // 從起站停靠準備發車開始模擬（先看到起站停靠 5 秒後發車移動）
            simTimeSec = startSec + 3;
            renderStaticRouteAndStops();
            renderStopTimelineList();
            updateSimulatedBus();

            isPlaying = true;
            lastFrameTimestamp = performance.now();
            requestAnimationFrame(animationLoop);
        }

        function goHome() {
            isPlaying = false;
            document.getElementById('sim-view').classList.add('hidden');
            document.getElementById('btn-back-home').classList.add('hidden');
            document.getElementById('home-view').classList.remove('hidden');
        }

        // ==========================================
        // 幾何與靠站模擬計算引擎
        // ==========================================
        function calcDistanceM(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function getPathMetrics(routeKey, direction, rawPath) {
            const key = `${routeKey}_${direction}`;
            if (pathMetricsCache[key]) return pathMetricsCache[key];

            const path = (rawPath || []).map(toLatLng).filter(Boolean);
            const cumDist = [0];
            let total = 0;
            for (let i = 1; i < path.length; i++) {
                total += calcDistanceM(path[i - 1][0], path[i - 1][1], path[i][0], path[i][1]);
                cumDist.push(total);
            }
            pathMetricsCache[key] = { path, cumDist, totalDist: total };
            return pathMetricsCache[key];
        }

        function getCoordAtDistance(metrics, targetDist) {
            const { path, cumDist, totalDist } = metrics;
            if (!path.length) return [23.987, 121.601];
            if (targetDist <= 0) return path[0];
            if (targetDist >= totalDist) return path[path.length - 1];

            for (let i = 1; i < cumDist.length; i++) {
                if (cumDist[i] >= targetDist) {
                    const segStart = cumDist[i - 1];
                    const segLen = cumDist[i] - segStart;
                    const ratio = segLen > 0 ? (targetDist - segStart) / segLen : 0;
                    const lat = path[i - 1][0] + (path[i][0] - path[i - 1][0]) * ratio;
                    const lng = path[i - 1][1] + (path[i][1] - path[i - 1][1]) * ratio;
                    return [lat, lng];
                }
            }
            return path[path.length - 1];
        }

        function getSingleTripPosition(nowSec) {
            const { route, routeKey, directionKey, scheduleSegments } = activeSim;
            if (!route || scheduleSegments.length === 0) return null;

            const pattern = route.patterns[directionKey];
            const metrics = getPathMetrics(routeKey, directionKey, pattern.path);

            for (let i = 0; i < scheduleSegments.length; i++) {
                const seg = scheduleSegments[i];

                // 狀態 A：公車正停靠在該站牌上下客
                if (nowSec >= seg.arrTime && nowSec <= seg.depTime) {
                    const remainSec = Math.max(1, Math.ceil(seg.depTime - nowSec));
                    const isTerminal = i === scheduleSegments.length - 1;
                    return {
                        coord: getCoordAtDistance(metrics, seg.distM),
                        isDocking: true,
                        focusStopIdx: i,
                        statusText: isTerminal
                            ? `抵達終點站停靠：${seg.name}`
                            : `靠站停靠中：${seg.name}（約 ${remainSec} 秒後離站）`
                    };
                }

                // 狀態 B：公車離開本站，正在前往下一站的道路上行駛
                if (i < scheduleSegments.length - 1) {
                    const nextSeg = scheduleSegments[i + 1];
                    if (nowSec > seg.depTime && nowSec < nextSeg.arrTime) {
                        const travelRatio = (nowSec - seg.depTime) / Math.max(1, nextSeg.arrTime - seg.depTime);
                        // 加入平滑加減速曲線（Ease-in-out），讓起步與進站煞車更擬真
                        const smoothRatio = travelRatio < 0.5
                            ? 2 * travelRatio * travelRatio
                            : 1 - Math.pow(-2 * travelRatio + 2, 2) / 2;
                        const currentDist = seg.distM + (nextSeg.distM - seg.distM) * smoothRatio;

                        return {
                            coord: getCoordAtDistance(metrics, currentDist),
                            isDocking: false,
                            focusStopIdx: i + 1,
                            statusText: `行駛中，下一站：${nextSeg.name}`
                        };
                    }
                }
            }

            const lastSeg = scheduleSegments[scheduleSegments.length - 1];
            return {
                coord: getCoordAtDistance(metrics, lastSeg.distM),
                isDocking: true,
                focusStopIdx: scheduleSegments.length - 1,
                statusText: `已抵達終點站：${lastSeg.name}`
            };
        }

        function highlightTimelineStop(stopIdx, isDocking) {
            if (lastHighlightedStopIdx === `${stopIdx}_${isDocking}`) return;
            lastHighlightedStopIdx = `${stopIdx}_${isDocking}`;

            const { theme } = activeSim;
            const items = document.querySelectorAll('.timeline-stop-item');
            items.forEach((el, idx) => {
                if (idx === stopIdx) {
                    el.style.borderColor = isDocking ? "#f59e0b" : theme.primary;
                    el.style.backgroundColor = isDocking ? "#fffbeb" : theme.lightBg;
                    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    el.style.borderColor = "#e2e8f0";
                    el.style.backgroundColor = "#f8fafc";
                }
            });

            // 同步高亮地圖上的站名標籤
            labelMarkers.forEach((lbl, idx) => {
                const el = lbl.getElement();
                if (!el) return;
                const badge = el.querySelector('.station-badge');
                if (!badge) return;
                if (idx === stopIdx && isDocking) {
                    badge.classList.add('station-badge-docking');
                } else {
                    badge.classList.remove('station-badge-docking');
                }
            });
        }

        function updateSimulatedBus() {
            if (!busMarkersLayer || !activeSim.route) return;
            busMarkersLayer.clearLayers();

            const pos = getSingleTripPosition(simTimeSec);
            if (!pos) return;

            const { theme, operatorName, routeKey, startSec } = activeSim;
            const statusBox = document.getElementById('sim-live-status');
            const statusDot = document.getElementById('sim-status-dot');
            document.getElementById('sim-status-text').innerText = `${secToTimeStr(simTimeSec, true)} ｜ ${pos.statusText}`;

            if (pos.isDocking) {
                statusBox.style.backgroundColor = "#fffbeb";
                statusBox.style.borderColor = "#fcd34d";
                statusBox.style.color = "#92400e";
                statusDot.style.backgroundColor = "#f59e0b";
            } else {
                statusBox.style.backgroundColor = theme.lightBg;
                statusBox.style.borderColor = theme.border;
                statusBox.style.color = theme.text;
                statusDot.style.backgroundColor = theme.primary;
            }

            highlightTimelineStop(pos.focusStopIdx, pos.isDocking);

            // 動態建立公車圖示（停靠時加上橘色脈衝光圈與「靠站中」標籤）
            const dockingHtml = pos.isDocking
                ? `<div class="bus-docking-ring"></div><div class="bus-docking-tag">靠站停靠中</div>`
                : ``;

            const busIcon = L.divIcon({
                className: 'bus-marker-icon',
                html: `
                    <div class="bus-badge-wrapper">
                        ${dockingHtml}
                        <div class="bus-badge" style="background:${theme.primary}; transform:${pos.isDocking ? 'scale(1.12)' : 'scale(1)'};">
                            <i class="fa-solid fa-bus"></i>
                        </div>
                    </div>
                `,
                iconSize: [38, 38],
                iconAnchor: [19, 19]
            });

            const marker = L.marker(pos.coord, { icon: busIcon, zIndexOffset: 1000 });
            marker.bindPopup(`
                <div style="font-family:sans-serif;">
                    <span style="background:${theme.primary};color:white;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:bold;">${operatorName} · ${routeKey.replace('hualien_', '')} 路</span>
                    <div style="font-size:13px;font-weight:900;color:#0f172a;margin-top:4px;">${pos.statusText}</div>
                    <div style="font-size:11px;color:#64748b;margin-top:2px;">發車時間：${secToTimeStr(startSec)}</div>
                </div>
            `);
            marker.addTo(busMarkersLayer);
        }

        function renderStopTimelineList() {
            const { scheduleSegments, theme } = activeSim;
            const container = document.getElementById('stop-timeline-list');
            container.innerHTML = '';

            scheduleSegments.forEach((seg, idx) => {
                const item = document.createElement('div');
                item.className = "timeline-stop-item p-2.5 rounded-xl bg-slate-50 border border-slate-200/80 flex justify-between items-center cursor-pointer transition text-xs";
                item.title = "點擊直接模擬公車停靠此站";
                item.onclick = () => {
                    simTimeSec = seg.arrTime + 2; // 跳轉至該站剛進站停靠的瞬間
                    updateSimulatedBus();
                };
                item.innerHTML = `
                    <div class="flex items-center space-x-2.5 truncate">
                        <span class="w-5 h-5 rounded-full text-white text-[10px] font-mono font-bold flex items-center justify-center shrink-0" style="background:${theme.primary}">${idx + 1}</span>
                        <span class="font-bold text-slate-800 truncate">${seg.name}</span>
                    </div>
                    <span class="font-mono font-black px-2 py-0.5 rounded-md shrink-0" style="background:${theme.lightBg}; color:${theme.text};">${secToTimeStr(seg.arrTime)}</span>
                `;
                container.appendChild(item);
            });
        }

        function clearStaticLayers() {
            staticLayers.forEach(l => leafletMap.removeLayer(l));
            labelMarkers.forEach(l => leafletMap.removeLayer(l));
            staticLayers = [];
            labelMarkers = [];
        }

        function renderStaticRouteAndStops() {
            clearStaticLayers();
            const { route, directionKey, theme } = activeSim;
            if (!route) return;

            const pattern = route.patterns[directionKey];
            const stops = getStopsForDirection(route, directionKey);
            const lineColor = theme.primary;

            if (pattern && Array.isArray(pattern.path) && pattern.path.length > 0) {
                const correctedPath = pattern.path.map(toLatLng).filter(Boolean);
                const polyline = L.polyline(correctedPath, {
                    color: lineColor,
                    weight: 5,
                    opacity: 0.85
                }).addTo(leafletMap);
                staticLayers.push(polyline);
                leafletMap.fitBounds(polyline.getBounds(), { padding: [40, 40] });
            }

            const showLabels = document.getElementById('toggle-labels').checked;
            stops.forEach((st, idx) => {
                if (!st.coord) return;
                const [lat, lng] = st.coord;
                const isTerminal = idx === 0 || idx === stops.length - 1;

                const circle = L.circleMarker([lat, lng], {
                    radius: isTerminal ? 8 : 5,
                    fillColor: isTerminal ? lineColor : '#ffffff',
                    color: lineColor,
                    weight: 2.5,
                    fillOpacity: 1
                }).addTo(leafletMap);

                circle.bindPopup(`
                    <div style="font-family:sans-serif;">
                        <div style="font-size:10px;color:#64748b;font-weight:bold;">站序 #${idx + 1}</div>
                        <div style="font-size:14px;font-weight:900;color:#0f172a;">${st.name}</div>
                    </div>
                `);
                staticLayers.push(circle);

                const labelIcon = L.divIcon({
                    className: 'station-label-icon',
                    html: `<div class="station-badge">${idx + 1}. ${st.name}</div>`,
                    iconSize: [0, 0],
                    iconAnchor: [0, 0]
                });
                const lblMarker = L.marker([lat, lng], { icon: labelIcon, interactive: false });
                if (showLabels) lblMarker.addTo(leafletMap);
                labelMarkers.push(lblMarker);
            });
        }

        function toggleStationLabels() {
            const show = document.getElementById('toggle-labels').checked;
            labelMarkers.forEach(lbl => {
                if (show) lbl.addTo(leafletMap);
                else leafletMap.removeLayer(lbl);
            });
        }

        function secToTimeStr(totalSec, includeSec = false) {
            const s = Math.floor(totalSec) % 86400;
            const hh = String(Math.floor(s / 3600)).padStart(2, '0');
            const mm = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
            const ss = String(s % 60).padStart(2, '0');
            return includeSec ? `${hh}:${mm}:${ss}` : `${hh}:${mm}`;
        }

        function animationLoop(timestamp) {
            if (!isPlaying) return;
            const dt = (timestamp - lastFrameTimestamp) / 1000;
            lastFrameTimestamp = timestamp;

            simTimeSec += dt * SIM_SPEED;
            // 抵達終點站並停靠展示後，循環重播該班次
            if (simTimeSec > activeSim.endSec + 10) {
                simTimeSec = activeSim.startSec;
            }

            updateSimulatedBus();
            requestAnimationFrame(animationLoop);
        }

        window.onload = () => {
            loadNetworkData();
        };
    </script>
</body>
