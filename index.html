<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>花蓮公車路線時刻與動態模擬檢視器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        #leaflet-map-box { height: 560px; width: 100%; border-radius: 1.5rem; z-index: 10; }

        .station-label-icon { background: transparent; border: none; }
        .station-badge {
            background: rgba(15, 23, 42, 0.88);
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 6px;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            transform: translateY(-20px);
            display: inline-block;
        }
        .bus-marker-icon { background: transparent; border: none; }
        .bus-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            color: white;
            font-size: 13px;
            border: 2.5px solid #ffffff;
            box-shadow: 0 3px 10px rgba(0,0,0,0.45);
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

    <!-- 頁首導覽（已移除匯入按鈕與狀態列） -->
    <header class="bg-slate-900 text-white shadow-xl sticky top-0 z-50 border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-500 p-2.5 rounded-2xl text-white shadow-lg shadow-emerald-500/30">
                    <i class="fa-solid fa-bus text-xl"></i>
                </div>
                <div>
                    <h1 class="font-black text-lg tracking-wide text-white">花蓮公車路線時刻與動態模擬器</h1>
                    <p class="text-[11px] text-emerald-400 font-semibold tracking-wider">整合全縣 26 條公車路網、實體站牌座標與 24 小時班次動態模擬</p>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-6 space-y-6">

        <!-- 時間模擬控制列 -->
        <div class="bg-slate-900 text-white rounded-3xl p-5 shadow-lg border border-slate-800 space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center space-x-3">
                    <button id="btn-play-pause" onclick="togglePlay()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black px-4 py-2 rounded-xl text-xs flex items-center transition shadow-md">
                        <i id="play-icon" class="fa-solid fa-play mr-1.5"></i><span id="play-text">開始模擬</span>
                    </button>
                    <div class="bg-slate-800 px-4 py-1.5 rounded-xl border border-slate-700 font-mono text-xl font-black text-amber-400 tracking-wider" id="sim-clock-display">
                        08:00:00
                    </div>
                    <span id="active-bus-count" class="text-xs font-bold bg-blue-500/20 text-blue-300 border border-blue-500/30 px-3 py-1.5 rounded-xl">
                        此路線行駛中：0 輛
                    </span>
                </div>

                <!-- 模擬倍速選擇 -->
                <div class="flex items-center space-x-1.5 bg-slate-800 p-1 rounded-xl border border-slate-700 text-xs font-bold">
                    <span class="text-slate-400 px-2">倍速：</span>
                    <button onclick="setSpeed(1)" id="spd-1" class="px-2.5 py-1 rounded-lg text-slate-300 hover:bg-slate-700">1×</button>
                    <button onclick="setSpeed(30)" id="spd-30" class="px-2.5 py-1 rounded-lg bg-emerald-500 text-slate-950 font-black">30×</button>
                    <button onclick="setSpeed(60)" id="spd-60" class="px-2.5 py-1 rounded-lg text-slate-300 hover:bg-slate-700">60×</button>
                    <button onclick="setSpeed(300)" id="spd-300" class="px-2.5 py-1 rounded-lg text-slate-300 hover:bg-slate-700">300×</button>
                </div>
            </div>

            <!-- 00:00 ~ 24:00 時間軸滑桿 -->
            <div class="space-y-1">
                <input type="range" id="time-slider" min="0" max="86399" value="28800" oninput="onSliderChange(this.value)" class="w-full accent-emerald-500 cursor-pointer h-2 bg-slate-700 rounded-lg">
                <div class="flex justify-between text-[10px] font-mono text-slate-400 px-1">
                    <span>00:00</span><span>04:00</span><span>08:00</span><span>12:00</span><span>16:00</span><span>20:00</span><span>24:00</span>
                </div>
            </div>
        </div>

        <!-- 路線選擇按鈕區 -->
        <div class="bg-white rounded-3xl p-5 border border-slate-200/80 shadow-md space-y-3">
            <div class="text-xs font-extrabold text-slate-400 uppercase tracking-wider flex justify-between items-center">
                <span><i class="fa-solid fa-layer-group text-emerald-600 mr-2"></i>選擇路線</span>
                <span class="text-[11px] text-slate-500">點擊路線編號切換檢視</span>
            </div>
            <div id="route-buttons-grid" class="flex flex-wrap gap-2"></div>
        </div>

        <!-- 路線標題與方向切換 -->
        <div class="bg-white rounded-3xl p-5 border border-slate-200/80 shadow-md flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <div class="flex items-center space-x-3">
                    <span id="route-code-badge" class="bg-slate-800 text-white text-xs font-bold px-3 py-1 rounded-lg">載入中</span>
                    <h2 id="route-title" class="text-xl font-black text-slate-800">正在讀取路網資料...</h2>
                </div>
                <p id="route-desc" class="text-sm text-slate-500 font-bold mt-1">請稍候，正在同步站牌與路線軌跡</p>
            </div>
            <div id="direction-tabs" class="flex bg-slate-100 p-1.5 rounded-2xl text-xs font-bold space-x-1"></div>
        </div>

        <!-- 主體內容：左側時刻表與右側地圖並排 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- 左側：發車時間列表 -->
            <div class="bg-white rounded-3xl p-6 border border-slate-200/80 shadow-md space-y-4 flex flex-col h-[560px]">
                <h3 id="schedule-heading" class="font-extrabold text-sm text-slate-800 flex items-center border-b border-slate-100 pb-3">
                    <i class="fa-solid fa-clock text-emerald-600 mr-2"></i>發車時間表
                </h3>
                <div id="schedule-list" class="space-y-2 overflow-y-auto pr-1 flex-1 no-scrollbar">
                    <div class="text-center text-xs text-slate-400 py-12">載入時刻表中...</div>
                </div>
            </div>

            <!-- 右側：地圖路徑與動態公車展示 -->
            <div class="lg:col-span-2 bg-white rounded-3xl p-6 border border-slate-200/80 shadow-md space-y-3">
                <div class="flex justify-between items-center">
                    <h3 class="font-extrabold text-sm text-slate-800 flex items-center">
                        <i class="fa-solid fa-map-location-dot text-emerald-600 mr-2 text-base"></i>公車道路折線、站牌位置與動態模擬
                    </h3>
                    <label class="text-xs font-bold text-slate-600 flex items-center cursor-pointer select-none">
                        <input type="checkbox" id="toggle-labels" checked onchange="toggleStationLabels()" class="mr-1.5 rounded text-blue-600">
                        顯示站名標籤
                    </label>
                </div>
                <div id="leaflet-map-box" class="shadow-inner border border-slate-200"></div>
            </div>

        </div>

    </main>

    <script>
        let allRoutesData = [];
        let globalStopsMap = {};
        let currentRouteKey = null;
        let currentDirectionKey = null;
        let pathMetricsCache = {};

        let leafletMap = null;
        let staticLayers = [];
        let labelMarkers = [];
        let busMarkersLayer = null;

        let simTimeSec = 28800; // 預設 08:00:00
        let isPlaying = false;
        let simSpeed = 30;
        let lastFrameTimestamp = null;

        // 自動偵測 [經度, 緯度] 並轉換為 Leaflet 需要的 [緯度, 經度]
        function toLatLng(coord) {
            if (!Array.isArray(coord) || coord.length < 2) return null;
            const a = Number(coord[0]);
            const b = Number(coord[1]);
            if (Math.abs(a) > 90) return [b, a];
            return [a, b];
        }

        function getRouteKey(r, fallbackIdx = 0) {
            return String(r.code || r.id || r.routeId || r.routeNumber || r.name || `route_${fallbackIdx}`);
        }

        function initMap() {
            leafletMap = L.map('leaflet-map-box').setView([23.987, 121.601], 13);
            L.tileLayer('https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}', {
                maxZoom: 19,
                attribution: '&copy; 內政部國土測繪中心'
            }).addTo(leafletMap);
            busMarkersLayer = L.layerGroup().addTo(leafletMap);
        }

        // 自動讀取同目錄下的 bus_network.json（適用於 GitHub Pages / HTTP Server）
        async function loadNetworkData() {
            try {
                const res = await fetch('./bus_network.json');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                if (!data || !Array.isArray(data.routes)) {
                    throw new Error("JSON 格式不符，找不到 routes 陣列");
                }

                globalStopsMap = {};
                if (Array.isArray(data.stops)) {
                    data.stops.forEach(s => { if (s.id) globalStopsMap[s.id] = s; });
                } else if (data.stops && typeof data.stops === 'object') {
                    Object.assign(globalStopsMap, data.stops);
                }

                allRoutesData = data.routes.filter(r => r && r.patterns);
                pathMetricsCache = {};

                if (allRoutesData.length > 0) {
                    currentRouteKey = getRouteKey(allRoutesData[0], 0);
                    const dirs = Object.keys(allRoutesData[0].patterns);
                    currentDirectionKey = dirs[0] || "outbound";
                    updateDisplay();
                }
            } catch (err) {
                console.error("讀取路網資料失敗：", err);
                document.getElementById('route-code-badge').innerText = "載入失敗";
                document.getElementById('route-title').innerText = "無法讀取 bus_network.json";
                document.getElementById('route-desc').innerText = "請確認 bus_network.json 已與本網頁一同上傳至 GitHub 同一資料夾中。";
            }
        }

        function getStopsForDirection(route, directionKey) {
            const pattern = route.patterns ? route.patterns[directionKey] : null;
            const patternId = pattern ? (pattern.id || directionKey) : directionKey;

            if (route.stops && !Array.isArray(route.stops)) {
                if (Array.isArray(route.stops[directionKey])) return route.stops[directionKey];
                if (Array.isArray(route.stops[patternId])) return route.stops[patternId];
            }

            const stopLookup = { ...globalStopsMap };
            if (Array.isArray(route.stops)) {
                route.stops.forEach(s => { if (s.id) stopLookup[s.id] = s; });
            } else if (route.stops && typeof route.stops === 'object') {
                Object.values(route.stops).forEach(val => {
                    if (Array.isArray(val)) val.forEach(s => { if (s.id) stopLookup[s.id] = s; });
                    else if (val && val.id) stopLookup[val.id] = val;
                });
            }

            if (pattern && Array.isArray(pattern.stopCalls) && pattern.stopCalls.length > 0) {
                return pattern.stopCalls.map((call, idx) => {
                    const stObj = stopLookup[call.stopId] || {};
                    return {
                        id: call.stopId,
                        name: call.name || call.stopName || stObj.name || `第 ${idx + 1} 站`,
                        coord: call.coord || stObj.coord || (stObj.lat && stObj.lng ? [stObj.lat, stObj.lng] : null),
                        status: stObj.status || ""
                    };
                }).filter(s => s.coord);
            }

            if (Array.isArray(route.stops)) {
                const filtered = route.stops.filter(s => s.patternId === patternId || s.direction === directionKey);
                return filtered.length > 0 ? filtered : route.stops;
            }

            return [];
        }

        function getTripsForDirection(route, directionKey) {
            if (!route.trips) return [];
            const pattern = route.patterns ? route.patterns[directionKey] : null;
            const patternId = pattern ? (pattern.id || directionKey) : directionKey;

            if (!Array.isArray(route.trips)) {
                return route.trips[directionKey] || route.trips[patternId] || [];
            }
            return route.trips.filter(t => t.patternId === patternId || t.direction === directionKey || t.patternId === directionKey);
        }

        function getTimingProfileForDirection(route, directionKey, sampleTrip) {
            if (!route.timingProfiles) return null;
            const pattern = route.patterns ? route.patterns[directionKey] : null;
            const patternId = pattern ? (pattern.id || directionKey) : directionKey;
            const profileId = sampleTrip ? sampleTrip.timingProfileId : null;

            if (!Array.isArray(route.timingProfiles)) {
                return (profileId && route.timingProfiles[profileId])
                    || route.timingProfiles[directionKey]
                    || route.timingProfiles[patternId]
                    || null;
            }
            const found = route.timingProfiles.find(p => p.id === profileId || p.patternId === patternId || p.direction === directionKey);
            return found ? (found.stops || found.calls || found) : null;
        }

        function calcDistanceM(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function getPathMetrics(routeKey, direction, rawPath) {
            const key = `${routeKey}_${direction}`;
            if (pathMetricsCache[key]) return pathMetricsCache[key];

            const path = rawPath.map(toLatLng).filter(Boolean);
            const cumDist = [0];
            let total = 0;
            for (let i = 1; i < path.length; i++) {
                total += calcDistanceM(path[i - 1][0], path[i - 1][1], path[i][0], path[i][1]);
                cumDist.push(total);
            }
            pathMetricsCache[key] = { path, cumDist, totalDist: total };
            return pathMetricsCache[key];
        }

        function getCoordAtDistance(metrics, targetDist) {
            const { path, cumDist, totalDist } = metrics;
            if (targetDist <= 0) return path[0];
            if (targetDist >= totalDist) return path[path.length - 1];

            for (let i = 1; i < cumDist.length; i++) {
                if (cumDist[i] >= targetDist) {
                    const segStart = cumDist[i - 1];
                    const segLen = cumDist[i] - segStart;
                    const ratio = segLen > 0 ? (targetDist - segStart) / segLen : 0;
                    const lat = path[i - 1][0] + (path[i][0] - path[i - 1][0]) * ratio;
                    const lng = path[i - 1][1] + (path[i][1] - path[i - 1][1]) * ratio;
                    return [lat, lng];
                }
            }
            return path[path.length - 1];
        }

        function getBusPositionForTrip(route, routeKey, direction, trip, nowSec) {
            const pattern = route.patterns[direction];
            const stops = getStopsForDirection(route, direction);
            if (!pattern || !Array.isArray(pattern.path) || pattern.path.length < 2) return null;

            const metrics = getPathMetrics(routeKey, direction, pattern.path);
            const profile = getTimingProfileForDirection(route, direction, trip);
            const stopCalls = Array.isArray(pattern.stopCalls) ? pattern.stopCalls : null;

            if (Array.isArray(profile) && profile.length > 0) {
                const firstDep = trip.startSec + (profile[0].departureOffsetSec ?? profile[0].arrivalOffsetSec ?? 0);
                const lastEntry = profile[profile.length - 1];
                const lastArr = trip.startSec + (lastEntry.arrivalOffsetSec ?? lastEntry.departureOffsetSec ?? 0);

                if (nowSec < firstDep || nowSec > lastArr) return null;

                for (let i = 0; i < profile.length; i++) {
                    const pNow = profile[i];
                    const arrTime = trip.startSec + (pNow.arrivalOffsetSec ?? 0);
                    const depTime = trip.startSec + (pNow.departureOffsetSec ?? arrTime);

                    const distHere = (stopCalls && stopCalls[i] && typeof stopCalls[i].distanceAlongPathM === 'number')
                        ? stopCalls[i].distanceAlongPathM
                        : (metrics.totalDist * (i / Math.max(1, profile.length - 1)));

                    if (nowSec >= arrTime && nowSec <= depTime) {
                        const stopName = stops[i] ? stops[i].name : `第 ${i + 1} 站`;
                        return {
                            coord: getCoordAtDistance(metrics, distHere),
                            statusText: `停靠中：${stopName}`
                        };
                    }

                    if (i < profile.length - 1) {
                        const pNext = profile[i + 1];
                        const nextArr = trip.startSec + (pNext.arrivalOffsetSec ?? 0);
                        if (nowSec > depTime && nowSec < nextArr) {
                            const distNext = (stopCalls && stopCalls[i + 1] && typeof stopCalls[i + 1].distanceAlongPathM === 'number')
                                ? stopCalls[i + 1].distanceAlongPathM
                                : (metrics.totalDist * ((i + 1) / Math.max(1, profile.length - 1)));

                            const ratio = (nextArr > depTime) ? (nowSec - depTime) / (nextArr - depTime) : 0;
                            const currentDist = distHere + (distNext - distHere) * ratio;
                            const nextName = stops[i + 1] ? stops[i + 1].name : `第 ${i + 2} 站`;
                            return {
                                coord: getCoordAtDistance(metrics, currentDist),
                                statusText: `前往：${nextName}`
                            };
                        }
                    }
                }
            }
            return null;
        }

        function getCurrentRoute() {
            return allRoutesData.find((r, idx) => getRouteKey(r, idx) === currentRouteKey);
        }

        function updateSimulatedBuses() {
            if (!busMarkersLayer) return;
            busMarkersLayer.clearLayers();

            const route = getCurrentRoute();
            if (!route) return;

            let activeCount = 0;
            const dirs = Object.keys(route.patterns);

            dirs.forEach((dir, dIdx) => {
                const trips = getTripsForDirection(route, dir);
                const badgeColor = dIdx === 0 ? "#2563eb" : "#059669";
                const dirLabel = (route.patterns[dir] && route.patterns[dir].headsign) ? route.patterns[dir].headsign : (dir === "outbound" ? "去程" : "返程");

                trips.forEach(trip => {
                    const pos = getBusPositionForTrip(route, currentRouteKey, dir, trip, simTimeSec);
                    if (pos) {
                        activeCount++;
                        const busIcon = L.divIcon({
                            className: 'bus-marker-icon',
                            html: `<div class="bus-badge" style="background:${badgeColor};"><i class="fa-solid fa-bus"></i></div>`,
                            iconSize: [30, 30],
                            iconAnchor: [15, 15]
                        });

                        const marker = L.marker(pos.coord, { icon: busIcon, zIndexOffset: 1000 });
                        marker.bindPopup(`
                            <div style="font-family:sans-serif;">
                                <span style="background:${badgeColor};color:white;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:bold;">${currentRouteKey.replace('hualien_', '')} · ${dirLabel}</span>
                                <div style="font-size:14px;font-weight:900;margin-top:4px;color:#0f172a;">${pos.statusText}</div>
                                <div style="font-size:11px;color:#64748b;margin-top:2px;">起站發車：${secToTimeStr(trip.startSec)}</div>
                            </div>
                        `);
                        marker.addTo(busMarkersLayer);
                    }
                });
            });

            document.getElementById('active-bus-count').innerText = `此路線行駛中：${activeCount} 輛`;
        }

        function secToTimeStr(totalSec, includeSec = false) {
            const s = Math.floor(totalSec) % 86400;
            const hh = String(Math.floor(s / 3600)).padStart(2, '0');
            const mm = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
            const ss = String(s % 60).padStart(2, '0');
            return includeSec ? `${hh}:${mm}:${ss}` : `${hh}:${mm}`;
        }

        function updateClockUI() {
            document.getElementById('sim-clock-display').innerText = secToTimeStr(simTimeSec, true);
            document.getElementById('time-slider').value = Math.floor(simTimeSec);
            updateSimulatedBuses();
        }

        function onSliderChange(val) {
            simTimeSec = Number(val);
            updateClockUI();
        }

        function setSpeed(spd) {
            simSpeed = spd;
            [1, 30, 60, 300].forEach(s => {
                const btn = document.getElementById(`spd-${s}`);
                btn.className = (s === spd)
                    ? "px-2.5 py-1 rounded-lg bg-emerald-500 text-slate-950 font-black"
                    : "px-2.5 py-1 rounded-lg text-slate-300 hover:bg-slate-700";
            });
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            const icon = document.getElementById('play-icon');
            const text = document.getElementById('play-text');
            if (isPlaying) {
                icon.className = "fa-solid fa-pause mr-1.5";
                text.innerText = "暫停模擬";
                lastFrameTimestamp = performance.now();
                requestAnimationFrame(animationLoop);
            } else {
                icon.className = "fa-solid fa-play mr-1.5";
                text.innerText = "開始模擬";
            }
        }

        function animationLoop(timestamp) {
            if (!isPlaying) return;
            const dt = (timestamp - lastFrameTimestamp) / 1000;
            lastFrameTimestamp = timestamp;

            simTimeSec += dt * simSpeed;
            if (simTimeSec >= 86400) simTimeSec -= 86400;

            updateClockUI();
            requestAnimationFrame(animationLoop);
        }

        function clearStaticLayers() {
            staticLayers.forEach(l => leafletMap.removeLayer(l));
            labelMarkers.forEach(l => leafletMap.removeLayer(l));
            staticLayers = [];
            labelMarkers = [];
        }

        function renderStaticRouteAndStops() {
            clearStaticLayers();
            const route = getCurrentRoute();
            if (!route) return;

            const pattern = route.patterns[currentDirectionKey];
            const stops = getStopsForDirection(route, currentDirectionKey);
            const lineColor = route.color || "#2563eb";

            if (pattern && Array.isArray(pattern.path) && pattern.path.length > 0) {
                const correctedPath = pattern.path.map(toLatLng).filter(Boolean);
                const polyline = L.polyline(correctedPath, {
                    color: lineColor,
                    weight: 5,
                    opacity: 0.8
                }).addTo(leafletMap);
                staticLayers.push(polyline);
                leafletMap.fitBounds(polyline.getBounds(), { padding: [40, 40] });
            }

            const showLabels = document.getElementById('toggle-labels').checked;
            stops.forEach((st, idx) => {
                const latLng = toLatLng(st.coord);
                if (!latLng) return;
                const [lat, lng] = latLng;
                const isTerminal = idx === 0 || idx === stops.length - 1;

                const circle = L.circleMarker([lat, lng], {
                    radius: isTerminal ? 8 : 5,
                    fillColor: isTerminal ? lineColor : '#ffffff',
                    color: lineColor,
                    weight: 2.5,
                    fillOpacity: 1
                }).addTo(leafletMap);

                circle.bindPopup(`
                    <div style="font-family:sans-serif;">
                        <div style="font-size:10px;color:#64748b;font-weight:bold;">站序 #${idx + 1} ${st.status ? `(${st.status})` : ''}</div>
                        <div style="font-size:14px;font-weight:900;color:#0f172a;">${st.name}</div>
                        <div style="font-size:10px;font-family:monospace;color:#2563eb;margin-top:4px;">${lat.toFixed(6)}, ${lng.toFixed(6)}</div>
                    </div>
                `);
                staticLayers.push(circle);

                const labelIcon = L.divIcon({
                    className: 'station-label-icon',
                    html: `<div class="station-badge">${idx + 1}. ${st.name}</div>`,
                    iconSize: [0, 0],
                    iconAnchor: [0, 0]
                });
                const lblMarker = L.marker([lat, lng], { icon: labelIcon, interactive: false });
                if (showLabels) lblMarker.addTo(leafletMap);
                labelMarkers.push(lblMarker);
            });
        }

        function toggleStationLabels() {
            const show = document.getElementById('toggle-labels').checked;
            labelMarkers.forEach(lbl => {
                if (show) lbl.addTo(leafletMap);
                else leafletMap.removeLayer(lbl);
            });
        }

        function renderRouteButtons() {
            const grid = document.getElementById('route-buttons-grid');
            grid.innerHTML = '';
            allRoutesData.forEach((r, idx) => {
                const rKey = getRouteKey(r, idx);
                const btn = document.createElement('button');
                const isActive = rKey === currentRouteKey;
                btn.className = isActive
                    ? "py-2 px-3.5 rounded-xl font-black text-xs transition border shadow-md bg-slate-900 text-white border-slate-900"
                    : "py-2 px-3.5 rounded-xl font-bold text-xs transition border shadow-sm bg-white text-slate-700 hover:bg-slate-50 border-slate-200";
                btn.textContent = rKey.replace('hualien_', '');
                btn.onclick = () => {
                    currentRouteKey = rKey;
                    const dirs = Object.keys(r.patterns);
                    if (!dirs.includes(currentDirectionKey)) {
                        currentDirectionKey = dirs[0];
                    }
                    updateDisplay();
                };
                grid.appendChild(btn);
            });
        }

        function renderDirectionTabs(route) {
            const container = document.getElementById('direction-tabs');
            container.innerHTML = '';
            const dirs = Object.keys(route.patterns);
            dirs.forEach(dir => {
                const btn = document.createElement('button');
                const isSelected = dir === currentDirectionKey;
                btn.className = isSelected
                    ? "px-4 py-2 rounded-xl bg-white text-emerald-600 shadow-sm font-black"
                    : "px-4 py-2 rounded-xl text-slate-600 hover:text-slate-900";
                const label = (route.patterns[dir] && route.patterns[dir].headsign)
                    ? route.patterns[dir].headsign
                    : (dir === "outbound" ? "去程" : dir === "inbound" ? "返程" : dir);
                btn.textContent = `【${label}】`;
                btn.onclick = () => {
                    currentDirectionKey = dir;
                    updateDisplay();
                };
                container.appendChild(btn);
            });
        }

        function renderSchedules() {
            const route = getCurrentRoute();
            if (!route) return;

            const trips = getTripsForDirection(route, currentDirectionKey);
            const stops = getStopsForDirection(route, currentDirectionKey);
            const container = document.getElementById('schedule-list');

            document.getElementById('route-code-badge').innerText = `${currentRouteKey.replace('hualien_', '')} 路線`;
            document.getElementById('route-code-badge').style.backgroundColor = route.color || '#1e293b';
            document.getElementById('route-title').innerText = route.name || currentRouteKey;
            const pathCount = (route.patterns[currentDirectionKey]?.path || []).length;
            document.getElementById('route-desc').innerText = `本方向共 ${stops.length} 個站牌、道路折線由 ${pathCount} 個經緯度頂點構成`;

            container.innerHTML = '';
            if (trips.length === 0) {
                container.innerHTML = `<div class="text-center text-xs text-slate-400 py-8">此方向無班次資料</div>`;
                return;
            }

            const sortedTrips = [...trips].sort((a, b) => a.startSec - b.startSec);
            sortedTrips.forEach((trip, i) => {
                const timeStr = secToTimeStr(trip.startSec);
                const item = document.createElement('div');
                item.className = "p-3 rounded-2xl bg-slate-50 border border-slate-200 flex justify-between items-center hover:border-emerald-500 hover:bg-emerald-50/40 cursor-pointer transition shadow-sm";
                item.onclick = () => {
                    simTimeSec = trip.startSec + 30;
                    updateClockUI();
                };
                item.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="w-6 h-6 rounded-full bg-slate-200 text-slate-600 text-[11px] font-mono font-bold flex items-center justify-center">${i + 1}</span>
                        <span class="text-base font-black text-slate-800 font-mono">${timeStr}</span>
                    </div>
                    <span class="text-xs font-bold text-blue-600 bg-blue-100/70 px-2.5 py-1 rounded-lg"><i class="fa-solid fa-location-crosshairs mr-1"></i>跳轉模擬</span>
                `;
                container.appendChild(item);
            });
        }

        function updateDisplay() {
            const route = getCurrentRoute();
            if (!route) return;
            renderRouteButtons();
            renderDirectionTabs(route);
            renderSchedules();
            renderStaticRouteAndStops();
            updateSimulatedBuses();
        }

        window.onload = () => {
            initMap();
            loadNetworkData();
        };
    </script>
</body>
</html>
